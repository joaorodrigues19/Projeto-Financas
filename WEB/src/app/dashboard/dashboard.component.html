<div class="dashboard">
    <div class="cards">
        <div class="card">
            <span class="card-label">Saldo</span>
            <span class="card-valor saldo">R$ {{saldo | number:'1.2-2'}}</span>
        </div>
        <div class="card">
            <span class="card-label">Receitas</span>
            <span class="card-valor receita">R$ {{receitas | number:'1.2-2'}}</span>
        </div>
        <div class="card">
            <span class="card-label">Despesas</span>
            <span class="card-valor despesa">R$ {{despesas | number:'1.2-2'}}</span>
        </div>
    </div>

    <div class="graficos">
        <div class="grafico-card">
            <h3>Despesas por Categoria</h3>
            <canvas #graficoPizza></canvas>
        </div>
        <div class="grafico-card">
            <h3>Receitas x Despesas</h3>
            <canvas #graficoLinha></canvas>
        </div>
        <div class="grafico-card">
            <h3>Saldo Mensal</h3>
            <canvas #graficoBarra></canvas>
        </div>
    </div>
</div>

<div class="categoria-container">
    <h2>{{editandoId ? 'Editar Categoria' : 'Nova Categoria'}}</h2>

    <div *ngIf="mensagem" class="mensagem" [class.sucesso]="mensagemTipo === 'sucesso'" [class.erro]="mensagemTipo === 'erro'">
        {{mensagem}}
    </div>

    <form (ngSubmit)="salvar()" class="categoria-form">
        <input type="text" [(ngModel)]="form.nome" name="nome" placeholder="Nome" required />

        <select [(ngModel)]="form.tipo" name="tipo">
            <option value="RECEITA">Receita</option>
            <option value="DESPESA">Despesa</option>
        </select>

        <input type="color" [(ngModel)]="form.cor" name="cor" />
        <div class="icone-upload" (click)="iconeInput.click()">
            <input #iconeInput type="file" accept="image/*" (change)="onIconeSelecionado($event)" hidden />
            <img *ngIf="form.icone" [src]="form.icone" class="icone-preview" />
            <span *ngIf="!form.icone" class="icone-placeholder">📎 Icone</span>
        </div>

        <button type="submit">{{editandoId ? 'Atualizar' : 'Criar'}}</button>
        <button type="button" *ngIf="editandoId" (click)="limparForm()">Cancelar</button>
    </form>

    <div class="categoria-lista">
        <div *ngFor="let cat of categorias" class="categoria-card" [style.border-left]="'4px solid ' + cat.cor">
            <img *ngIf="cat.icone && cat.icone.startsWith('data:')" [src]="cat.icone" class="categoria-icone" />
            <span *ngIf="!cat.icone || !cat.icone.startsWith('data:')" class="categoria-cor-dot" [style.background]="cat.cor"></span>
            <span class="categoria-nome">{{cat.nome}}</span>
            <span class="categoria-tipo" [class.tipo-receita]="cat.tipo === 'RECEITA'" [class.tipo-despesa]="cat.tipo === 'DESPESA'">{{cat.tipo}}</span>
            <div class="categoria-acoes">
                <button (click)="editar(cat)">Editar</button>
                <button *ngIf="confirmarExclusaoId !== cat.id" (click)="pedirConfirmacao(cat.id)">Excluir</button>
                <div *ngIf="confirmarExclusaoId === cat.id" class="confirmacao">
                    <span>Excluir?</span>
                    <button class="btn-sim" (click)="confirmarExclusao()">Sim</button>
                    <button class="btn-nao" (click)="cancelarExclusao()">Não</button>
                </div>
            </div>
        </div>
    </div>
</div>
